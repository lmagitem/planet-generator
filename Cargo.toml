[package]
name = "planet_generator"
version = "0.0.8-pre-alpha"
edition = "2021"
description = "[WIP] Generates data for galaxies, sectors, solar systems, planets and their inhabitants (Check README for features list)."
license = "MIT"

[dependencies]
seeded_dice_roller = "1.1.0"
log = "0.4.27"
simple_logger = "5.0.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
smart-default = "0.7.1"
ordered-float = "5.0.0"
resvg = { version = "0.48.1", default-features = false }
lazy_static = "1.5.0"
strum = "0.27.1"
strum_macros = "0.27.1"
time = "0.3.41"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[[bench]]
name = "generation"
harness = false
